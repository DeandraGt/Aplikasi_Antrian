
# QueueApp — development environment
#
# Tiga service, sesuai arsitektur di docs/requirements.md:
#   mysql  -> database
#   server -> API
#   web    -> client browser
#
# Nilai variabel dibaca dari file .env (salin dari .env.example).
#
# Perintah dasar:
#   docker compose up -d       menjalankan seluruh service
#   docker compose ps          melihat status service
#   docker compose logs -f     melihat log
#   docker compose down        menghetikan service

services:
  # --------------------------------------------------------------------------
  # Database. Schema-nya belum ada — itu pekerjaan Minggu 10.
  # Untuk sekarang container ini hanya perlu hidup dan siap menerima koneksi.
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: queueapp-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      # host:container — port host dibuat berbeda agar tidak bentrok
      # dengan MySQL yang mungkin sudah terpasang di komputer sendiri.
      - "${DB_HOST_PORT}:3306"
    volumes:
      # Named volume: data tetap ada walaupun container dihapus.
      - mysql_data:/var/lib/mysql
    networks:
      - queueapp

  # --------------------------------------------------------------------------
  # API. Minggu 01 masih placeholder Node tanpa dependency.
  # Express masuk pada Minggu 09, koneksi MySQL pada Minggu 10.
  # --------------------------------------------------------------------------
  server:
    image: node:20-alpine
    container_name: queueapp-server
    restart: unless-stopped
    working_dir: /app
    command: node placeholder.js
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: 3000
      DB_HOST: ${DB_HOST}
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${SERVER_PORT}:3000"
    volumes:
      # Bind mount: file di folder server/ langsung terbaca di dalam container.
      - ./server:/app
    depends_on:
      - mysql
    networks:
      - queueapp

  # --------------------------------------------------------------------------
  # Dev server Vite, menggantikan nginx yang sebelumnya melayani HTML statis.
  #
  # Vite melayani berkas sumber langsung dan menyuntikkan perubahan ke
  # peramban tanpa memuat ulang halaman (hot module replacement), jadi tidak
  # ada langkah build selama pengembangan.
  # --------------------------------------------------------------------------
  web:
    # Bookworm (glibc), bukan Alpine (musl). Dependency Vite memuat binary
    # native — rolldown dan lightningcss — yang varian glibc dan musl-nya
    # berbeda. package-lock.json dibuat di lingkungan glibc, jadi image
    # glibc membuat container dan lockfile sepakat.
    image: node:20-bookworm-slim
    container_name: queueapp-web
    restart: unless-stopped
    working_dir: /app

    # npm ci memasang persis isi package-lock.json — lebih cepat dan lebih
    # dapat diulang daripada npm install. Ia dijalankan hanya ketika perlu:
    # salinan package-lock.json ditinggalkan di dalam volume node_modules, dan
    # selama isinya masih sama persis, pemasangan dilewati sehingga container
    # hidup dalam hitungan detik.
    #
    # Yang dibandingkan adalah lockfile, bukan sekadar ada-tidaknya folder
    # node_modules. Menambah dependency — react-router-dom pada Minggu 07, dan
    # yang menyusul pada minggu berikutnya — mengubah lockfile tetapi tidak
    # mengosongkan volume. Tanpa perbandingan ini, container yang sudah ada
    # tetap berjalan memakai dependency lama dan menyisakan halaman kosong
    # yang sulit ditebak sebabnya.
    command: >
      sh -c "cmp -s package-lock.json node_modules/.terpasang ||
          { npm ci --no-audit --no-fund && cp package-lock.json node_modules/.terpasang; };
          npm run dev"
    ports:
      - "${WEB_PORT}:5173"
    volumes:
      - ./web:/app

      # Volume anonim untuk node_modules. Tanpa ini, folder kosong dari host
      # akan menutupi hasil npm install di dalam container — dan dependency
      # yang dikompilasi untuk Linux tidak selalu cocok dengan host.
      - /app/node_modules
    depends_on:
      - server
    networks:
      - queueapp

volumes:
  mysql_data:

networks:
  queueapp:
    driver: bridge
